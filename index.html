<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Leather Products | Handcrafted Leather</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#faf7f2;--ln:#e6dfd3;--br:#8a5f1c;--cr:#1f1710;--mut:#6b5d4c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cr);font:16px/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;font-weight:500;line-height:1.2;margin:0 0 .5em}
a{color:var(--br)}:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--cr);color:#000;padding:8px;z-index:99}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--ln)}
.logo{font-size:1.6rem;color:var(--br);text-decoration:none;margin:0}
nav{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}nav a{color:var(--cr);text-decoration:none;padding:4px 0}nav a[aria-current]{border-bottom:2px solid var(--br)}
main{padding:32px 5vw;max-width:1200px;margin:auto}main.full{max-width:none;padding:0}
.btn{background:var(--br);color:#fff;border:0;padding:12px 22px;font:600 1rem inherit;font-family:inherit;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--cr);border:1px solid var(--br)}
.hero{padding:9vh 0;max-width:640px}.hero h1{font-size:clamp(2.4rem,7vw,4.5rem)}.hero p{color:var(--mut);font-size:1.15rem}.hero .btn{margin:6px 10px 6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:0;list-style:none}
.card{background:var(--bg2);border:1px solid var(--ln);border-radius:4px;overflow:hidden}.card a{color:inherit;text-decoration:none;display:block}
.sw{aspect-ratio:4/3;background:#f3ece0}.sw img{width:100%;height:100%;object-fit:cover;display:block}
.card div.t{padding:12px 14px}.price{color:var(--br);font-weight:600}.mut{color:var(--mut)}s{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.chips a{border:1px solid var(--ln);padding:4px 12px;border-radius:99px;text-decoration:none;color:var(--cr);font-size:.9rem}.chips a[aria-current]{background:var(--br);color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--ln);text-align:left}
input,select{width:100%;padding:10px;background:var(--bg2);color:var(--cr);border:1px solid var(--ln);border-radius:3px;font:inherit}label{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--mut)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}.err{color:#ff9a8a;font-size:.85rem;min-height:1em}
.q{display:inline-flex;align-items:center;gap:8px}.q button{width:34px;height:34px;background:var(--bg2);color:var(--cr);border:1px solid var(--ln);border-radius:3px;cursor:pointer;font-size:1.1rem}
.note{background:var(--bg2);border-left:3px solid var(--br);padding:10px 14px;margin:16px 0}
#sr{position:relative;height:calc(100dvh - 70px);min-height:420px;background:#000;touch-action:none}#cv{width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:12px;max-width:min(360px,80%);background:#1c120bcc;padding:10px 14px;border-radius:4px;font-size:.9rem}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:1px solid var(--cr);border-radius:50%;pointer-events:none}
#lab{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#1c120bee;border:1px solid var(--br);padding:8px 14px;border-radius:4px;display:none;text-align:center}
#joy{position:absolute;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;border:2px solid var(--br);background:#1c120b88;display:none}#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--br)}
@media(pointer:coarse){#joy{display:block}}
#pp{position:absolute;inset:0;background:#000b;display:none;place-items:center;padding:16px;overflow:auto}#pp .box{background:#fff;color:#1f1710;max-width:960px;width:100%;border-radius:6px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center}#pp img{width:100%;border-radius:4px;background:#f3ece0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--cr);color:#fff;padding:10px 18px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
footer{padding:28px 5vw;border-top:1px solid var(--ln);color:var(--mut);display:flex;flex-wrap:wrap;gap:8px 22px}
#hud,#lab{color:#f1e6d0}#hud a{color:#e8c27a}#lab{border-color:#c29a4a}#joy i{background:#c29a4a}#joy{border-color:#c29a4a}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

<header><a class="logo" href="#home">Leather Products</a>
<nav aria-label="Main"><a href="#home">Home</a><a href="#showroom">3D showroom</a><a href="#catalogue">Catalogue</a><a href="#orders">Orders</a><a href="#help">Support</a><a href="#cart">Cart (<span id="cc" aria-live="polite">0</span>)</a></nav></header>
<main id="app" tabindex="-1"></main>

<footer><a href="#policy">Privacy, terms, shipping and returns</a><a href="#help">Contact</a><span>Demo store: no real payments are taken.</span></footer>

<script>
const CATS={belts:"Leather belts",wallets:"Wallets",cardholders:"Cardholders",handbags:"Handbags",totes:"Tote bags",crossbody:"Crossbody bags",backpacks:"Backpacks",briefcases:"Briefcases",duffles:"Travel duffle bags",laptop:"Laptop bags",keychains:"Keychains",passports:"Passport holders",journals:"Leather journals",gifts:"Gift collections",other:"Other accessories"};
const COL={belts:"#6b4423",wallets:"#4a2c17",cardholders:"#8a5a2b",handbags:"#7a3b24",totes:"#9a6b3a",crossbody:"#5b3420",backpacks:"#3e2616",briefcases:"#2f1c10",duffles:"#7b5230",laptop:"#4d3320",keychains:"#a3732f",passports:"#6a3a20",journals:"#58341c",gifts:"#8b4a2b",other:"#6e4a2a"};
const P=`belts|Harness Belt|2499|Full-grain buffalo, brass buckle|120x4 cm
belts|Reversible Dress Belt|1999|Vegetable-tanned cowhide|115x3.5 cm
wallets|Bifold Wallet|1799|Pull-up leather, 8 card slots|11x9 cm
wallets|Long Zip Wallet|2299|Saffiano leather|20x10 cm

handbags|Satchel Handbag|7499|Italian vegetable-tanned leather|30x24x12 cm
handbags|Structured Top-Handle|8999|Calf leather, suede lining|28x20x11 cm
totes|Everyday Tote|6499|Full-grain, cotton lining|38x30x12 cm
crossbody|Mini Crossbody|4299|Nappa leather|21x15x6 cm
crossbody|Saddle Crossbody|4999|Pull-up leather|24x17x7 cm
backpacks|Roll-Top Backpack|9499|Waxed full-grain leather|42x30x14 cm
briefcases|Classic Briefcase|11999|Buffalo leather, brass hardware|40x30x10 cm
duffles|Weekender Duffle|13999|Oil-tanned leather|52x28x26 cm
laptop|15-inch Laptop Sleeve Bag|6999|Padded full-grain|40x30x5 cm
keychains|Brass Keyfob|599|Leather and solid brass|9x3 cm
passports|Passport Holder|1299|Full-grain, card slots|14x10 cm

journals|Pocket Notebook Cover|899|Soft calf leather|A6

gifts|Traveller Gift Set|4499|Passport holder, luggage tag, keyfob|Gift box
other|Valet Tray|1899|Moulded leather|24x16 cm
other|Cable Organiser|799|Leather|18x10 cm`.split("\n").map((l,i)=>{const[c,n,p,m,d]=l.split("|");return{id:i+1,cat:c,name:n,price:+p,mat:m,dim:d,disc:i%4==0?10:0,stock:(i*3)%7+(i==4?0:2)}});
`belts|Braided Leather Belt|1799|Woven cowhide|110x3 cm
wallets|Travel Organiser Wallet|3299|Full-grain, zip pocket|22x11 cm
cardholders|Card Case with Pocket|1299|Pebbled leather|10x8 cm

handbags|Bucket Handbag|6999|Soft nappa|26x26x14 cm
totes|Zip-Top Work Tote|7299|Full-grain, laptop sleeve|40x32x13 cm
totes|Market Tote|3999|Vegetable-tanned leather|36x30x10 cm
crossbody|Camera Crossbody|5499|Pull-up leather|20x14x9 cm
backpacks|Commuter Backpack|8499|Full-grain, padded straps|40x28x12 cm
backpacks|Mini Backpack|5999|Soft calf leather|25x22x9 cm
briefcases|Slim Document Case|8999|Saffiano leather|38x28x6 cm
briefcases|Executive Attache|12999|Hand-stitched buffalo|42x31x12 cm
duffles|Gym Duffle|9999|Waxed leather|48x25x24 cm
duffles|Overnight Duffle|11999|Full-grain, shoe compartment|45x26x23 cm
laptop|13-inch Messenger|5999|Distressed leather|36x27x8 cm
laptop|Slim Laptop Folio|4499|Full-grain, magnetic close|35x25x3 cm
keychains|Tag Keychain|499|Veg-tan leather|8x3 cm
keychains|Carabiner Key Holder|799|Leather, steel clip|10x3 cm
passports|Travel Wallet|2199|Pebbled leather|24x13 cm
passports|Luggage Tag Set|899|Full-grain, 2 tags|10x6 cm
journals|Travel Notebook|1999|Refillable, leather cover|A5
gifts|Groom Gift Set|5499|Wallet, belt, keyfob|Gift box
other|Leather Coasters, Set of 4|999|Vegetable-tanned leather|10 cm each`.split("\n").forEach(l=>{const[c,n,p,m,d]=l.split("|");P.push({id:0,cat:c,name:n,price:+p,mat:m,dim:d,disc:P.length%4==0?10:0,stock:(P.length*3)%7+2})});
P.sort((a,b)=>Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat)||a.id-b.id);P.forEach((p,i)=>p.id=i+1);
const S='stroke="#f6ecd8" stroke-dasharray="5 4" opacity=".65" fill="none"',G="#d4a94a";
const shade=(h,k)=>"#"+[1,3,5].map(i=>Math.max(0,Math.min(255,parseInt(h.slice(i,i+2),16)+k)).toString(16).padStart(2,"0")).join("");
const ART={
belts:(c,d)=>`<rect x="30" y="125" width="340" height="50" rx="8" fill="${c}"/><path d="M42 138H358M42 162H358" ${S}/><rect x="262" y="110" width="62" height="80" rx="8" fill="none" stroke="${G}" stroke-width="9"/><rect x="288" y="120" width="8" height="60" fill="${G}"/>${[60,95,130,165,200].map(x=>`<circle cx="${x}" cy="150" r="5" fill="${d}"/>`).join("")}`,
wallets:(c,d)=>`<rect x="95" y="70" width="210" height="165" rx="14" fill="${c}"/><rect x="95" y="70" width="210" height="55" rx="14" fill="${d}"/><rect x="108" y="140" width="184" height="82" rx="9" ${S}/><circle cx="200" cy="125" r="9" fill="${G}"/>`,
cardholders:(c,d)=>`<rect x="125" y="50" width="150" height="50" rx="6" fill="#fff"/><rect x="135" y="38" width="130" height="40" rx="6" fill="#c9b79a"/><rect x="110" y="85" width="180" height="150" rx="12" fill="${c}"/><path d="M110 125Q200 150 290 125" stroke="${d}" stroke-width="4" fill="none"/><rect x="122" y="145" width="156" height="78" rx="8" ${S}/>`,
handbags:(c,d)=>`<path d="M140 105C140 20 260 20 260 105" fill="none" stroke="${d}" stroke-width="12"/><path d="M90 110H310L335 240Q200 258 65 240Z" fill="${c}"/><path d="M90 110H310L318 155H82Z" fill="${d}"/><rect x="185" y="143" width="30" height="24" rx="4" fill="${G}"/><path d="M95 190Q200 205 305 190" ${S}/>`,
totes:(c,d)=>`<path d="M145 105C145 20 255 20 255 105" fill="none" stroke="${d}" stroke-width="12"/><path d="M85 100H315L300 250H100Z" fill="${c}"/><rect x="85" y="100" width="230" height="24" fill="${d}"/><path d="M112 150H288M115 225H285" ${S}/>`,
crossbody:(c,d)=>`<path d="M115 125C60 10 340 10 285 125" fill="none" stroke="${d}" stroke-width="10"/><rect x="105" y="120" width="190" height="125" rx="16" fill="${c}"/><path d="M105 150Q200 195 295 150V136Q295 120 279 120H121Q105 120 105 136Z" fill="${d}"/><circle cx="200" cy="180" r="10" fill="${G}"/>`,
backpacks:(c,d)=>`<path d="M140 90C55 120 65 240 130 252M260 90C345 120 335 240 270 252" fill="none" stroke="${d}" stroke-width="14"/><rect x="185" y="30" width="30" height="34" rx="12" fill="none" stroke="${d}" stroke-width="8"/><rect x="120" y="55" width="160" height="200" rx="45" fill="${c}"/><rect x="145" y="155" width="110" height="72" rx="14" fill="${d}"/><path d="M150 112H250" stroke="${G}" stroke-width="6"/><rect x="152" y="163" width="96" height="56" rx="9" ${S}/>`,
briefcases:(c,d)=>`<path d="M160 95V62H240V95" fill="none" stroke="${d}" stroke-width="11"/><rect x="55" y="90" width="290" height="155" rx="14" fill="${c}"/><path d="M55 155H345" stroke="${d}" stroke-width="5"/><rect x="105" y="143" width="30" height="24" rx="3" fill="${G}"/><rect x="265" y="143" width="30" height="24" rx="3" fill="${G}"/><rect x="70" y="102" width="260" height="130" rx="9" ${S}/>`,
duffles:(c,d)=>`<path d="M115 112C135 35 265 35 285 112" fill="none" stroke="${d}" stroke-width="11"/><path d="M35 140Q35 100 80 100H320Q365 100 365 140V205Q365 238 320 238H80Q35 238 35 205Z" fill="${c}"/><rect x="170" y="100" width="60" height="138" fill="${d}" opacity=".55"/><path d="M50 160H350" ${S}/><circle cx="200" cy="170" r="9" fill="${G}"/>`,
laptop:(c,d)=>`<rect x="165" y="62" width="70" height="30" rx="12" fill="none" stroke="${d}" stroke-width="9"/><rect x="45" y="85" width="310" height="150" rx="14" fill="${c}"/><path d="M45 125H355" stroke="${d}" stroke-width="5"/><path d="M62 112H338M62 222H338" ${S}/><rect x="185" y="118" width="30" height="18" rx="4" fill="${G}"/>`,
keychains:(c,d)=>`<circle cx="200" cy="68" r="36" fill="none" stroke="${G}" stroke-width="8"/><rect x="168" y="100" width="64" height="150" rx="16" fill="${c}"/><circle cx="200" cy="128" r="9" fill="${G}"/><rect x="178" y="145" width="44" height="95" rx="10" ${S}/>`,
passports:(c,d)=>`<rect x="115" y="42" width="170" height="220" rx="12" fill="${c}"/><circle cx="200" cy="130" r="40" fill="none" stroke="${G}" stroke-width="4"/><path d="M160 130H240M200 90V170" stroke="${G}" stroke-width="3"/><rect x="127" y="54" width="146" height="196" rx="8" ${S}/>`,
journals:(c,d)=>`<rect x="105" y="42" width="190" height="225" rx="10" fill="${c}"/><rect x="105" y="42" width="28" height="225" rx="8" fill="${d}"/><rect x="262" y="42" width="12" height="225" fill="${d}"/><rect x="105" y="170" width="190" height="14" fill="${G}"/><rect x="145" y="58" width="105" height="190" rx="6" ${S}/>`,
gifts:(c,d)=>`<rect x="75" y="115" width="250" height="135" rx="6" fill="${c}"/><rect x="65" y="88" width="270" height="42" rx="6" fill="${d}"/><rect x="185" y="88" width="30" height="162" fill="${G}"/><path d="M200 88C140 28 115 85 200 88C285 85 260 28 200 88Z" fill="none" stroke="${G}" stroke-width="9"/>`,
other:(c,d)=>`<rect x="60" y="105" width="280" height="140" rx="26" fill="${c}"/><rect x="82" y="125" width="236" height="98" rx="16" fill="${d}"/><rect x="92" y="135" width="216" height="78" rx="12" ${S}/><rect x="150" y="90" width="100" height="24" rx="6" fill="${G}"/>`};
const img=p=>{const c=shade(COL[p.cat],(p.id%3-1)*16),d=shade(c,-34);return"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 400 300"><defs><radialGradient id="g" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#f9f4ea"/><stop offset="1" stop-color="#e0d2bb"/></radialGradient></defs><rect width="400" height="300" fill="url(#g)"/><ellipse cx="200" cy="270" rx="140" ry="11" fill="#0003"/>${ART[p.cat](c,d)}</svg>`)};
const $=s=>document.querySelector(s),app=$("#app"),inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),pr=p=>p.price*(1-p.disc/100);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cart=store.get("gm-cart2",{}),clean=null;
const saveCart=()=>{store.set("gm-cart2",cart);$("#cc").textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function add(id){const p=P.find(x=>x.id==id);if(!p.stock)return toast("Sold out");if((cart[id]||0)>=p.stock)return toast("Only "+p.stock+" in stock");cart[id]=(cart[id]||0)+1;saveCart();toast(p.name+" added to cart")}
function totals(){let sub=0,dis=0;for(const id in cart){const p=P.find(x=>x.id==id);sub+=p.price*cart[id];dis+=(p.price-pr(p))*cart[id]}const net=sub-dis,ship=!net||net>=3000?0:99,tax=net*.18;return{sub,dis,ship,tax,total:net+ship+tax}}
const card=p=>`<li class="card"><a href="#product-${p.id}"><div class="sw"><img src="${img(p)}" alt="${p.name}, ${CATS[p.cat]}" loading="lazy"></div><div class="t"><h3>${p.name}</h3><span class="price">${inr(pr(p))}</span> ${p.disc?`<s>${inr(p.price)}</s>`:""}<br><span class="mut">${p.stock?p.stock+" in stock":"Sold out"}</span></div></a></li>`;
const views={
home:()=>`<section class="hero"><h1>Leather made slowly, sold the way a shop should be.</h1><p>Walk into our virtual boutique and handle every piece, or browse the catalogue. Your cart follows you either way.</p><a class="btn" href="#showroom">Enter the showroom</a><a class="btn ghost" href="#catalogue">Browse the catalogue</a></section><h2>Featured</h2><ul class="grid">${P.filter((p,i)=>i%4==1||i==5).slice(0,4).map(card).join("")}</ul>`,
catalogue:(c)=>`<h1>${c?CATS[c]:"All products"}</h1><nav class="chips" aria-label="Categories"><a href="#catalogue" ${c?"":"aria-current=page"}>All</a>${Object.keys(CATS).map(k=>`<a href="#cat-${k}" ${k==c?"aria-current=page":""}>${CATS[k]}</a>`).join("")}</nav><ul class="grid">${P.filter(p=>!c||p.cat==c).map(card).join("")||"<li>No products in this category yet.</li>"}</ul>`,
